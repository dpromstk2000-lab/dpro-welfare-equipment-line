name: DPRO Tutorial R5 Manuals
# R5 workflow repair version: V1.2

on:
  push:
    branches: [main]
    paths:
      - tutorial-r5-build.py
      - .github/workflows/tutorial-r5-manuals.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-r5-manuals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify forward-only R4 baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASELINE="afaa3e18e43eb736873bc659fe261b9d13b07f3e"
          git merge-base --is-ancestor "$BASELINE" origin/main
          echo "R4 baseline is an ancestor of current main."

      - name: Fix R5 preview PNG output path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tutorial-r5-build.py")
          text = path.read_text(encoding="utf-8")

          old = 'shutil.copy2(prefix.with_suffix(".png"), out_png)'
          new = 'shutil.copy2(Path(str(prefix) + ".png"), out_png)'

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
              print("R5 preview path fix applied.")
          elif new in text:
              print("R5 preview path already fixed.")
          else:
              raise SystemExit("Expected render_preview copy expression not found; refusing unknown edit.")
          PY

          if ! git diff --quiet -- tutorial-r5-build.py; then
            git config user.name "dpro-tutorial-bot"
            git config user.email "actions@users.noreply.github.com"
            git add tutorial-r5-build.py
            git commit -m "Fix R5 preview PNG output path [skip ci]"
            git push origin HEAD:main
          fi

          python - <<'PY'
          from pathlib import Path
          text = Path("tutorial-r5-build.py").read_text(encoding="utf-8")
          expected = 'shutil.copy2(Path(str(prefix) + ".png"), out_png)'
          if expected not in text:
              raise SystemExit("R5 preview path fix QA failed")
          print("R5 preview path fix QA: PASS")
          PY

      - name: Repair Tutorial asset links on Tutorial-enabled pages
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pages = [
              "index.html",
              "member.html",
              "inquiry.html",
              "owner.html",
              "owner-ipad.html",
              "planning.html",
              "contract.html",
              "aftercare.html",
              "billing.html",
              "staff.html",
              "staff-login.html",
              "operations.html",
              "system-check.html",
          ]

          css = '<link rel="stylesheet" href="tutorial.css">'
          js = '<script src="tutorial.js"></script>'
          changed = []

          for name in pages:
              path = Path(name)
              if not path.exists():
                  raise SystemExit(f"Required Tutorial page missing: {name}")

              text = path.read_text(encoding="utf-8")
              original = text

              if 'href="tutorial.css"' not in text:
                  marker = '<link rel="stylesheet" href="styles.css">'
                  if marker in text:
                      text = text.replace(marker, marker + "\n  " + css, 1)
                  elif "</head>" in text:
                      text = text.replace("</head>", "  " + css + "\n</head>", 1)
                  else:
                      raise SystemExit(f"Cannot place tutorial.css in {name}")

              if 'src="tutorial.js"' not in text:
                  if "</body>" not in text:
                      raise SystemExit(f"Cannot place tutorial.js in {name}")
                  text = text.replace("</body>", js + "\n</body>", 1)

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(name)

          # R4 Guide Center must itself load Tutorial assets.
          guide = Path("guide-center.html").read_text(encoding="utf-8")
          if 'href="tutorial.css"' not in guide or 'src="tutorial.js"' not in guide:
              raise SystemExit("Guide Center Tutorial asset linkage is incomplete")

          # Every First10 route must now be Tutorial-enabled.
          required_first10 = [
              "member.html", "inquiry.html", "planning.html", "contract.html",
              "staff.html", "aftercare.html", "billing.html", "operations.html",
          ]
          for name in required_first10:
              text = Path(name).read_text(encoding="utf-8")
              if 'href="tutorial.css"' not in text or 'src="tutorial.js"' not in text:
                  raise SystemExit(f"First10 linkage QA failed: {name}")

          print("Tutorial linkage repaired:", ", ".join(changed) if changed else "no changes needed")
          Path(".r5_tutorial_repair_changed").write_text("1" if changed else "0", encoding="utf-8")
          PY

          if [[ "$(cat .r5_tutorial_repair_changed)" == "1" ]]; then
            git config user.name "dpro-tutorial-bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html member.html inquiry.html owner.html owner-ipad.html planning.html contract.html aftercare.html billing.html staff.html staff-login.html operations.html system-check.html
            git commit -m "Repair WELFARE_EQUIPMENT First10 Tutorial linkage for R5 QA"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f .r5_tutorial_repair_changed

      - name: Wait for repaired Tutorial on live GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          import urllib.request

          base = "https://dpromstk2000-lab.github.io/dpro-welfare-equipment-line/"
          checks = {
              "member.html": ('src="tutorial.js"', 'href="tutorial.css"'),
              "planning.html": ('src="tutorial.js"', 'href="tutorial.css"'),
              "staff.html": ('src="tutorial.js"', 'href="tutorial.css"'),
              "operations.html": ('src="tutorial.js"', 'href="tutorial.css"'),
              "guide-center.html": ('src="tutorial.js"', 'href="tutorial.css"'),
          }

          last = []
          for attempt in range(60):
              failed = []
              for page, needles in checks.items():
                  url = base + page + f"?r5qa={attempt}"
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "DPRO-Tutorial-R5-Live-QA/1.1",
                              "Cache-Control": "no-cache",
                          },
                      )
                      with urllib.request.urlopen(req, timeout=20) as res:
                          body = res.read().decode("utf-8", "ignore")
                      if int(res.status) != 200 or any(n not in body for n in needles):
                          failed.append(page)
                  except Exception:
                      failed.append(page)

              if not failed:
                  print("Live Pages Tutorial linkage: PASS")
                  break

              last = failed
              print(f"Live Pages not ready yet ({attempt + 1}/60): {', '.join(failed)}")
              time.sleep(5)
          else:
              raise SystemExit("Live Pages Tutorial linkage did not become ready: " + ", ".join(last))
          PY

      - name: Install rendering and QR QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils zbar-tools
          python -m pip install --upgrade pip
          python -m pip install selenium qrcode pillow
          google-chrome --version || chromium --version

      - name: Build manuals from live Pages and run R5 QA
        shell: bash
        run: |
          set -euo pipefail
          python tutorial-r5-build.py

      - name: Upload R5 build artifact before repository write
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_WELFARE_EQUIPMENT_R5_MANUALS
          path: |
            manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_QUICK_START_V1.0.pdf
            manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_DETAILED_MANUAL_V1.0.pdf
            manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_QUICK_START_V1.0.png
            manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_DETAILED_MANUAL_V1.0.png
            manuals/R5_MANUAL_QA_EVIDENCE.txt
            manuals/screens/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit R5 manual assets and QA evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf manuals/_build
          git config user.name "dpro-tutorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add manuals
          if git diff --cached --quiet; then
            echo "No manual asset changes to commit."
            exit 0
          fi
          git commit -m "Add WELFARE_EQUIPMENT Tutorial R5 manuals [skip ci]"
          git push origin HEAD:main
